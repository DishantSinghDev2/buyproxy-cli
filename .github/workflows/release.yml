name: Release
# Tag vX.Y.Z → publish to npm (with provenance), attach the standalone file to a
# GitHub release, and bump the Homebrew formula in DishantSinghDev2/homebrew-tap.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm pkg set devDependencies.buyproxy="^1.0.0"
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck && npm test && npm run build
      - name: Check the tag matches package.json
        run: test "v$(node -p "require('./package.json').version")" = "${GITHUB_REF_NAME}"
      - run: node scripts/make-standalone.mjs
      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Checksums
        run: cd dist && sha256sum buyproxy.mjs > buyproxy.mjs.sha256
      - uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            dist/buyproxy.mjs
            dist/buyproxy.mjs.sha256
      - name: Update the Homebrew tap
        env:
          TAP_GITHUB_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
        run: ./scripts/update-tap.sh "${GITHUB_REF_NAME#v}"
